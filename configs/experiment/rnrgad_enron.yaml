# @package _global_

defaults:
  - override /data: gad
  - override /model: rnrgad
  - override /callbacks: rnrgad
  - override /trainer: gpu
  - _self_

task_name: rnrgad
tags:
  - rnrgad
  - enron
seed: 42
reseed_after_model_init: true

data:
  dataset: enron
  feature_normalization: zscore
  preserve_raw_features: true

model:
  cfg:
    attention:
      source_prior:
        - 0.3
        - 0.5
        - 0.2
      epsilon_max: 1.0

trainer:
  max_epochs: 50

optimized_metric: val/loss

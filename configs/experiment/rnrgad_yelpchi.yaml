# @package _global_

defaults:
  - override /data: gad
  - override /model: rnrgad
  - override /callbacks: rnrgad
  - override /trainer: gpu
  - _self_

task_name: rnrgad
tags:
  - rnrgad
  - yelpchi
seed: 42
reseed_after_model_init: true

data:
  dataset: yelpchi
  feature_normalization: zscore
  preserve_raw_features: true

model:
  cfg:
    views:
      context: false
    mechanism_views:
      topology:
        degree_high: false
      local_consistency:
        neighbor_cosine: false

trainer:
  max_epochs: 50

optimized_metric: val/loss
